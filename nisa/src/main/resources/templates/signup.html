<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録 | NISA資産管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/signup.css">

</head>
<body>
  <div class="layout">
    <!-- 左パネル(ログイン画面と共通デザイン) -->
    <div class="brand-panel">
      <div class="brand-mark">つみたて<span>NISA</span></div>

      <div class="brand-copy">
        <div class="eyebrow">ASSET GROWTH SIMULATOR</div>
        <h1>今日から始める、<br>未来のための積立。</h1>
      </div>

      <div class="brand-footnote">つみたてNISA・成長投資枠の資産シミュレーションと管理を、ひとつの画面で。</div>
    </div>

    <!-- 右パネル：新規登録フォーム -->
    <div class="form-panel">
      <div class="form-card">
        <h2>新規登録</h2>
        <p class="sub">アカウントを作成してはじめましょう</p>

        <div class="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/signup}" method="post">
          <div class="field">
            <label for="name">お名前</label>
            <input type="text" id="name" name="name" placeholder="田中 太郎" required autofocus>
          </div>

          <div class="field">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" placeholder="○○○○@co.jp" required>
          </div>

          <div class="field">
            <label for="password">パスワード</label>
            <input type="password" id="password" name="password" placeholder="8文字以上" required minlength="8">
          </div>

          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

          <button type="submit" class="submit-btn">登録する</button>
        </form>

        <p class="login-hint">すでにアカウントをお持ちの方は <a th:href="@{/login}">ログイン</a></p>
      </div>
    </div>
  </div>
</body>
</html>
