<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード変更 | NISA資産管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --sage:#7A9E7E; --sage-dark:#5F8160; --ink:#1f2a24; --muted:#6b7570; --border:#e3e9e0; --bg:#f4f7f2; }
    *{box-sizing:border-box} body{margin:0;font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink)}
    .app-header{display:flex;justify-content:space-between;align-items:center;padding:18px 32px;background:#fff;border-bottom:1px solid var(--border)}
    .brand-mark{font-family:'Noto Serif JP',serif;font-size:24px;font-weight:700}.brand-mark span{color:var(--sage)}
    .main-nav{display:flex;gap:22px}.main-nav a{color:var(--muted);text-decoration:none;font-weight:600}.main-nav a.active,.main-nav a:hover{color:var(--sage-dark)}
    .header-right{display:flex;align-items:center;gap:10px}.user-chip{display:flex;align-items:center;gap:10px;background:var(--bg);padding:8px 12px;border-radius:999px}
    .avatar{width:36px;height:36px;border-radius:50%;background:var(--sage);color:#fff;display:grid;place-items:center;font-weight:700}
    .page-body{max-width:720px;margin:48px auto;padding:0 20px 40px}.page-heading{margin-bottom:24px}.page-heading h1{margin:0 0 8px;font-size:28px}
    .sub{margin:0;color:var(--muted)}
    .card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:28px;box-shadow:0 10px 40px rgba(31,42,36,.06)}
    .field{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}.field label{font-weight:600}.field input{padding:12px 14px;border:1px solid var(--border);border-radius:12px;font-size:16px}
    .helper{font-size:13px;color:var(--muted);margin-top:-4px}.btn-primary{border:none;border-radius:999px;background:var(--sage);color:#fff;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer}
    .btn-outline{border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--ink);padding:10px 16px;text-decoration:none;display:inline-block;font-weight:600}
    .alert{padding:12px 14px;border-radius:12px;font-size:14px;margin-bottom:16px}.alert-error{background:#fde8e8;color:#b42318}.alert-success{background:#e8f6ea;color:#137333}
    .form-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand-mark">つみたて<span>NISA</span></div>
    <nav class="main-nav">
      <a th:href="@{/home}">ダッシュボード</a>
      <a th:href="@{/assets}">資産一覧</a>
      <a th:href="@{/simulation}">シミュレーション</a>
      <a th:href="@{/mypage}" class="active">マイページ</a>
    </nav>
    <div class="header-right">
      <div class="user-chip">
        <div class="avatar" th:text="${userName != null ? userName.substring(0, 1) : 'N'}">田</div>
        <span class="user-name" th:text="${userName}">田中 太郎</span>
      </div>
      <a th:href="@{/login}" style="display:inline-block;padding:6px 12px;border:1px solid #7A9E7E;border-radius:999px;color:#7A9E7E;text-decoration:none;font-weight:700;">ログイン画面へ</a>
    </div>
  </header>

  <main class="page-body">
    <div class="page-heading">
      <h1>パスワード変更</h1>
      <p class="sub">現在のパスワードを確認したうえで、新しいパスワードに変更できます</p>
    </div>

    <section class="card">
      <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
      <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

      <form th:action="@{/password-change}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="field">
          <label for="currentPassword">現在のパスワード</label>
          <input type="password" id="currentPassword" name="currentPassword" required>
        </div>

        <div class="field">
          <label for="newPassword">新しいパスワード</label>
          <input type="password" id="newPassword" name="newPassword" required minlength="8" placeholder="8文字以上">
          <div class="helper">8文字以上で入力してください</div>
        </div>

        <div class="field">
          <label for="confirmPassword">新しいパスワード（確認）</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" placeholder="もう一度入力してください">
        </div>

        <div class="form-actions">
          <button class="btn-primary" type="submit">変更する</button>
          <a class="btn-outline" th:href="@{/mypage}">マイページに戻る</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
