<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資産一覧 | NISA資産管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/assets.css}">
</head>
<body>

  <!-- ヘッダー -->
  <header class="app-header">
    <div class="brand-mark">つみたて<span>NISA</span></div>
    <nav class="main-nav">
      <a th:href="@{/home}">ダッシュボード</a>
      <a th:href="@{/assets}" class="active">資産一覧</a>
      <a th:href="@{/simulation}">シミュレーション</a>
      <a th:href="@{/mypage}">マイページ</a>
      <a th:href="@{/login}" style="display:inline-block;padding:6px 12px;border:1px solid #7A9E7E;border-radius:999px;color:#7A9E7E;text-decoration:none;font-weight:700;">ログイン画面へ</a>
    </nav>
    <div class="header-right">
      <div class="user-chip">
        <div class="avatar" th:text="${userName != null ? userName.substring(0, 1) : 'N'}">田</div>
        <span class="user-name" th:text="${userName}">田中 太郎</span>
      </div>
    </div>
  </header>

  <main class="page-body">
    <div class="page-heading-row">
      <div>
        <h1>資産一覧</h1>
        <p class="sub">保有している銘柄と評価損益を確認できます</p>
      </div>
      <a th:href="@{/asset-edit}" class="btn-primary">+ 資産を登録</a>
    </div>

    <!-- サマリーバー -->
    <div class="summary-row">
      <div class="card summary-card">
        <div class="summary-label">評価額合計</div>
        <div class="summary-value" th:text="${assetTotalValue}">¥1,842,600</div>
      </div>
      <div class="card summary-card">
        <div class="summary-label">投資元本合計</div>
        <div class="summary-value" th:text="${assetTotalInvestment}">¥1,656,000</div>
      </div>
      <div class="card summary-card">
        <div class="summary-label">評価損益</div>
        <div class="summary-value positive" th:text="${assetProfit}">+¥186,600</div>
      </div>
      <div class="card summary-card">
        <div class="summary-label">損益率</div>
        <div class="summary-value positive" th:text="${assetProfitRate}">+11.27%</div>
      </div>
    </div>

    <!-- フィルター -->
    <div class="filter-bar">
      <div class="filter-tabs">
        <button class="tab active" type="button">すべて</button>
        <button class="tab" type="button">つみたて投資枠</button>
        <button class="tab" type="button">成長投資枠</button>
      </div>
      <div class="search-box">
        <input type="text" placeholder="銘柄名で検索">
      </div>
    </div>

    <!-- 資産テーブル -->
    <div class="card table-card">
      <table class="asset-table">
        <thead>
          <tr>
            <th>銘柄名</th>
            <th>枠区分</th>
            <th class="num">保有口数</th>
            <th class="num">取得額</th>
            <th class="num">評価額</th>
            <th class="num">評価損益</th>
            <th class="actions-col"></th>
          </tr>
        </thead>
        <tbody>
              <tr th:if="${#lists.isEmpty(assets)}">
            <td colspan="7" class="empty-state">まだ資産が登録されていません。右上の「+ 資産を登録」を押して、まずは1件登録しましょう。</td>
          </tr>
          <tr th:each="asset : ${assets}">
            <td>
              <div class="asset-name" th:text="${asset.name}">eMAXIS Slim 全世界株式</div>
              <div class="asset-code" th:text="${asset.code}">オール・カントリー</div>
            </td>
            <td><span class="badge" th:text="${asset.frame}">つみたて</span></td>
            <td class="num" th:text="${#numbers.formatInteger(asset.quantity, '###,###')} + '口'">42,180口</td>
            <td class="num" th:text="'¥' + ${#numbers.formatInteger(asset.acquisition, '###,###')}">¥785,000</td>
            <td class="num" th:text="'¥' + ${#numbers.formatInteger(asset.currentValue, '###,###')}">¥862,400</td>
            <td class="num" th:with="profit=${asset.currentValue - asset.acquisition}">
              <span th:if="${profit >= 0}" th:text="'+' + '¥' + ${#numbers.formatInteger(profit, '###,###')}"></span>
              <span th:unless="${profit >= 0}" th:text="'¥' + ${#numbers.formatInteger(profit, '###,###')}"></span>
            </td>
            <td class="actions-col">
              <a th:href="@{/asset-edit}" class="link-edit">編集</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

</body>
</html>
