<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード再設定 | NISA資産管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
  <main class="reset-page">
    <section class="reset-card">
      <h1>パスワード再設定</h1>
      <p class="sub">登録したメールアドレスを入力してください。</p>

      <div class="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>
      <div class="success-message" th:if="${message}" th:text="${message}"></div>

      <!--
        本番では、この申請後に再設定URLをメール送信する。
        メール機能をまだ設定していないため、開発環境では確認用URLを表示している。
      -->
      <div class="reset-link-box" th:if="${resetUrl}">
        <strong>開発用の再設定URL</strong>
        <a th:href="${resetUrl}" th:text="${resetUrl}"></a>
        <small>本番環境ではこのURLを画面に表示せず、メールで送信する。</small>
      </div>

      <form th:action="@{/password-reset}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="field">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
        </div>
        <button type="submit" class="submit-btn">再設定URLを発行</button>
      </form>

      <p class="signup-hint"><a th:href="@{/login}">ログイン画面へ戻る</a></p>
    </section>
  </main>
</body>
</html>
