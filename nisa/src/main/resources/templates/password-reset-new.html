<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新しいパスワード | NISA資産管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
  <main class="reset-page">
    <section class="reset-card">
      <h1>新しいパスワードを設定</h1>
      <p class="sub">新しいパスワードを入力してください。</p>

      <div class="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

      <!-- hidden tokenで、申請時に発行されたURLの本人確認情報をPOSTへ引き継ぐ。 -->
      <form th:action="@{/password-reset/new}" method="post" th:object="${resetForm}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" th:field="*{token}">
        <div class="field">
          <label for="newPassword">新しいパスワード</label>
          <input type="password" id="newPassword" th:field="*{newPassword}" minlength="8" placeholder="8文字以上" required autofocus>
        </div>
        <div class="field">
          <label for="confirmPassword">新しいパスワード（確認）</label>
          <input type="password" id="confirmPassword" th:field="*{confirmPassword}" minlength="8" placeholder="もう一度入力してください" required>
        </div>
        <button type="submit" class="submit-btn">パスワードを更新</button>
      </form>

      <p class="signup-hint"><a th:href="@{/login}">ログイン画面へ戻る</a></p>
    </section>
  </main>
</body>
</html>
