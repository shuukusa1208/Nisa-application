# --- データベース接続設定 ---
spring.datasource.url=jdbc:mysql://localhost:3306/nisa_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo&useSSL=false
spring.datasource.username=root
spring.datasource.password=shuu1208
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate設定 ---
# 「ddl-auto=none」: テーブルは既にA5M2で作成済みなので、
# Hibernateにテーブル構造を変更させない(重要)。
# 学習用に自動生成させたい場合のみ "update" に変える(データ消失に注意)。
spring.jpa.hibernate.ddl-auto=none

# 発行されるSQLをログに表示する(学習・動作確認用)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

